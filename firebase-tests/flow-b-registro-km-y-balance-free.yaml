# KiloMenos - Test Case: Flow B (Firebase App Testing Agent)
tests:
  - displayName: "Flow B: Registro de KM y Balance (FREE)"
    steps:
      - goal: "Entrar en la aplicación usando las credenciales de prueba."
        finalScreenAssertion: "Debo ver la pantalla de Inicio (Dashboard) o la oferta de Premium."

      - goal: "Rechazar la oferta Premium si aparece para continuar como usuario gratuito."
        hint: "Pulsa en 'Continuar con la versión gratuita' o busca el botón de cerrar/ahora no."
        finalScreenAssertion: "Debo estar en la pantalla de Configura tu Renting o en el Dashboard."

      - goal: "Registrar el primer vehículo si la app lo solicita."
        hint: "Rellena el nombre (ej: Test Car), fecha, meses (ej: 12), km totales (ej: 20000) y odómetro actual (ej: 1000). Pulsa 'Guardar'."
        finalScreenAssertion: "Debo ver el Dashboard con el nombre del vehículo 'Test Car'."

      - goal: "Registrar una nueva lectura del odómetro."
        hint: "Pulsa el botón flotante '+' o 'Actualizar Kilometraje'. Introduce un valor superior al actual (ej: añade 100km). Pulsa 'Guardar'."
        finalScreenAssertion: "El diálogo de carga debe desaparecer y volver al Dashboard."

      - goal: "Verificar que el algoritmo ha recalculado el saldo."
        finalScreenAssertion: "El número bajo 'Saldo de Kilómetros' debe haber disminuido tras el registro."
