# KiloMenos - Test Case: Flow F (Firebase App Testing Agent)
tests:
  - displayName: "Flow F: Sincronización Diferida (Offline Mode)"
    steps:
      - goal: "Añadir un registro de kilómetros mientras el dispositivo está sin red."
        hint: "Con el modo avión activo, pulsa '+' en el Dashboard, introduce un valor (ej: añade 50km) y pulsa 'Guardar'."
        finalScreenAssertion: "Debo ver un icono de sincronización pendiente (nube con aviso) en la barra superior."

      - goal: "Verificar la animación de espera."
        finalScreenAssertion: "El icono de sincronización debe estar visible y preferiblemente pulsando."

      - goal: "Restablecer la conexión y verificar la subida automática."
        hint: "Simula la desactivación del modo avión o espera a que el sistema recupere red."
        finalScreenAssertion: "El icono de sincronización debe desaparecer automáticamente del Dashboard pasados unos segundos."
