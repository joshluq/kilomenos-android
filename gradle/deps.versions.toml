[versions]
# kits
foundationkit = "1.4.0"
canvaskit = "1.1.0"
encryptionkit  = "1.4.1"
authkit = "1.3.0"
analyticskit = "1.2.0"

# AndroidX
splashscreen = "1.0.1"
datastore = "1.2.1"
credentials = "1.6.0"

# Google Services
play-services-ads = "25.4.0"
play-services-location = "21.4.0"
play-services-maps = "20.0.0"
user-messaging-platform = "4.0.0"
googleid = "1.2.0"
billing = "9.1.0"

# Maps Utils
maps-utils = "5.1.1"
maps-compose = "8.4.0"

# Third Party
coil = "2.7.0"
cropper = "0.5.0"
accompanist = "0.37.3"
javax-inject = "1"

# Firebase
firebase-bom = "34.17.0"
google-services = "4.5.0"
crashlytics = "3.0.7"

[libraries]
# kits
foundationkit = { group = "es.joshluq.kit", name = "foundationkit", version.ref = "foundationkit" }
canvaskit = { group = "es.joshluq.kit", name = "canvaskit", version.ref = "canvaskit" }
encryptionkit = { group = "es.joshluq.kit", name = "encryptionkit", version.ref = "encryptionkit" }
authkit = { group = "es.joshluq.kit", name = "authkit", version.ref = "authkit" }
analyticskit = { group = "es.joshluq.kit", name = "analyticskit", version.ref = "analyticskit" }

# AndroidX
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }

# Google Services
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "play-services-ads" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "play-services-location" }
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "play-services-maps" }
user-messaging-platform = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "user-messaging-platform" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }

# Maps Utils
android-maps-utils = { group = "com.google.maps.android", name = "android-maps-utils", version.ref = "maps-utils" }
maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "maps-compose" }

# Third Party
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
compose-cropper = { group = "com.github.SmartToolFactory", name = "Compose-Cropper", version.ref = "cropper" }
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javax-inject" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-config = { group = "com.google.firebase", name = "firebase-config" }

[plugins]
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
